<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>元素荒原</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Silkscreen:wght@400;700&display=swap">
<style>
/* Layout: full-bleed pixel canvas; HUD pinned to the safe edges; menus are carved stone slabs laid over the live map */
:root{
  --ink:#0f0c17;
  --slab:#1d1828;
  --slab-2:#2a2339;
  --seam:#4a3e60;
  --bone:#f0e6d0;
  --dust:#a597b9;
  --ember:#ff8a3d;
  --frost:#7fd8f0;
  --volt:#ffe066;
  --moss:#8fd16a;
  --blood:#e8455a;
  --tide:#4fb8f0;
  --gold:#ffc94d;
  --f-ui:"DotGothic16","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"Silkscreen","DotGothic16",ui-monospace,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--ink);color:var(--bone);font-family:var(--f-ui);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#cv{position:fixed;left:0;top:0;display:block;image-rendering:pixelated;image-rendering:crisp-edges}

#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#xpbar{position:absolute;left:0;right:0;top:0;height:calc(env(safe-area-inset-top,0px) + 8px);background:#07050b;border-bottom:2px solid #000}
#xpfill{position:absolute;left:0;bottom:0;height:8px;width:0;background:var(--tide);box-shadow:inset 0 2px 0 rgba(255,255,255,.35),inset 0 -2px 0 rgba(0,0,0,.3)}
.hudrow{position:absolute;top:calc(env(safe-area-inset-top,0px) + 16px);left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:8px}
.vit{display:flex;flex-direction:column;gap:6px;min-width:0}
.hpline{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
#lvl{font-family:var(--f-num);font-size:12px;background:var(--slab);border:2px solid #000;padding:1px 5px;color:var(--volt)}
.hpbar{width:min(120px,26vw);height:10px;background:#2a0e14;border:2px solid #000;position:relative}
#hpfill{position:absolute;left:0;top:0;bottom:0;width:100%;background:var(--blood);box-shadow:inset 0 2px 0 rgba(255,255,255,.3)}
#hptext{font-family:var(--f-num);font-size:11px;text-shadow:1px 1px 0 #000;font-variant-numeric:tabular-nums}
#weps{display:flex;flex-wrap:wrap;gap:4px;max-width:200px}
.chip{width:22px;height:22px;display:grid;place-items:center;font-size:13px;line-height:1;background:var(--slab);border:2px solid #000;position:relative;color:var(--c)}
.chip.pas{width:18px;height:18px;font-size:11px;background:#15111d}
.chip.evo{box-shadow:0 0 0 1px var(--gold);background:#2b2110}
.chip b{position:absolute;right:-4px;bottom:-5px;font-family:var(--f-num);font-size:8px;font-weight:400;color:var(--bone);text-shadow:1px 1px 0 #000,-1px -1px 0 #000}
.clock{text-align:center}
#stage{font-size:11px;color:var(--dust);text-shadow:1px 1px 0 #000;margin-bottom:3px;letter-spacing:.08em}
#timer{font-family:var(--f-num);font-size:22px;line-height:1;text-shadow:2px 2px 0 #000;font-variant-numeric:tabular-nums}
#kills{font-size:11px;color:var(--dust);text-shadow:1px 1px 0 #000;margin-top:4px;font-variant-numeric:tabular-nums}
.tools{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:6px;pointer-events:auto}
.tbtn{font:inherit;font-size:12px;color:var(--bone);background:var(--slab);border:2px solid #000;box-shadow:inset 0 0 0 1px var(--seam);padding:4px 8px;cursor:pointer}
.tbtn:hover{box-shadow:inset 0 0 0 1px var(--volt)}
#terrain{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 12px);font-size:12px;background:rgba(15,12,23,.78);border:2px solid #000;padding:3px 8px}

#toasts{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 100px);display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;z-index:6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.toast{background:var(--slab);border:2px solid #000;box-shadow:inset 0 0 0 1px var(--volt);padding:5px 10px;font-size:13px;max-width:100%;animation:toast 3s forwards}
.toast small{color:var(--volt);margin-right:8px;font-size:11px;letter-spacing:.1em}
.toast.big{font-size:18px;color:var(--blood);box-shadow:inset 0 0 0 1px var(--blood)}
.toast.gold{font-size:18px;color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
@keyframes toast{0%{opacity:0;transform:translateY(-6px)}8%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}

#joy{position:fixed;width:96px;height:96px;margin:-48px 0 0 -48px;border:2px solid rgba(240,230,208,.35);border-radius:50%;background:rgba(15,12,23,.25);pointer-events:none;z-index:4}
#knob{position:absolute;left:50%;top:50%;width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50%;background:rgba(240,230,208,.45);border:2px solid rgba(0,0,0,.5)}

.screen{position:fixed;inset:0;z-index:10;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;background:rgba(10,8,16,.6);padding-block:calc(env(safe-area-inset-top,0px) + 20px) calc(env(safe-area-inset-bottom,0px) + 20px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));touch-action:pan-y}
.slab{margin:auto;width:100%;max-width:820px;background:var(--slab);border:3px solid #000;box-shadow:inset 0 0 0 2px var(--seam),8px 8px 0 rgba(0,0,0,.55);padding:22px clamp(14px,4vw,30px);display:flex;flex-direction:column;gap:14px;min-width:0}
.eyebrow{margin:0;font-size:12px;letter-spacing:.24em;color:var(--dust)}
h1{margin:0;font-size:clamp(42px,11vw,72px);line-height:1;font-weight:400;color:var(--ember);letter-spacing:.06em;text-shadow:3px 3px 0 #6b1d0c,6px 6px 0 #000;text-wrap:balance}
h2{margin:4px 0 0;font-size:16px;font-weight:400;color:var(--volt);letter-spacing:.12em;text-wrap:balance}
h3{margin:0;font-size:15px;font-weight:400;color:var(--bone)}
.lede{margin:0;font-size:15px;line-height:1.75;max-width:62ch}
.lede em{font-style:normal;color:var(--frost)}
.row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.card{font:inherit;color:var(--bone);text-align:left;background:var(--slab-2);border:2px solid #000;box-shadow:inset 0 0 0 1px var(--seam);padding:10px;display:grid;grid-template-columns:auto 1fr;gap:3px 10px;align-items:start;cursor:pointer;min-width:0}
.card:hover{box-shadow:inset 0 0 0 2px var(--c,var(--ember))}
.card.evo{background:#2b2312;box-shadow:inset 0 0 0 2px var(--gold)}
.card:focus-visible,.btn:focus-visible,.tbtn:focus-visible,.seg button:focus-visible,.tab:focus-visible,summary:focus-visible{outline:2px solid var(--volt);outline-offset:2px}
.pic{grid-row:span 2;width:40px;height:48px;image-rendering:pixelated;display:grid;place-items:center;font-size:24px;color:var(--c);background:#120e19;border:2px solid #000}
.card .nm{font-size:17px;color:var(--c,var(--bone))}
.card .meta{font-size:12px;color:var(--dust)}
.card .ds{grid-column:1/-1;font-size:13px;line-height:1.6;margin-top:4px}
.tag{font-family:var(--f-ui);font-size:11px;color:var(--ink);background:var(--c,var(--gold));padding:0 5px;margin-left:6px;vertical-align:2px}
.keys{margin:0;font-size:12px;color:var(--dust);line-height:1.9}
.keys kbd{font-family:var(--f-num);font-size:10px;background:var(--slab-2);border:1px solid var(--seam);padding:0 4px;color:var(--bone)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:inherit;font-size:15px;color:var(--ink);background:var(--ember);border:2px solid #000;box-shadow:inset 0 -3px 0 rgba(0,0,0,.3);padding:8px 16px;cursor:pointer}
.btn.alt{background:var(--slab-2);color:var(--bone);box-shadow:inset 0 0 0 1px var(--seam)}
.btn:hover{filter:brightness(1.1)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font:inherit;font-size:14px;color:var(--bone);background:var(--slab-2);border:2px solid #000;box-shadow:inset 0 0 0 1px var(--seam);padding:6px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--c);color:var(--ink);box-shadow:inset 0 -3px 0 rgba(0,0,0,.3)}
.hint{margin:0;font-size:13px;color:var(--dust);line-height:1.7}
.route{display:flex;flex-wrap:wrap;gap:4px 8px;font-size:13px;color:var(--dust);align-items:center}
.route span{color:var(--bone);background:var(--slab-2);border:1px solid var(--seam);padding:1px 8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.stat{background:var(--slab-2);border:2px solid #000;padding:8px 10px}
.stat span{display:block;font-size:12px;color:var(--dust)}
.stat b{font-family:var(--f-num);font-size:20px;font-weight:400;font-variant-numeric:tabular-nums}
.next{background:var(--slab-2);border:2px solid #000;box-shadow:inset 0 0 0 1px var(--seam);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.next p{margin:0;font-size:14px;line-height:1.7}

.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:2px solid #000;padding-bottom:8px}
.tab{font:inherit;font-size:14px;color:var(--dust);background:transparent;border:2px solid transparent;padding:5px 10px;cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);background:var(--volt);border-color:#000}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.fcard{background:var(--slab-2);border:2px solid #000;box-shadow:inset 0 0 0 1px var(--seam);padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.fcard.ok{box-shadow:inset 0 0 0 2px var(--gold)}
.fcard.done{opacity:.75}
.frow{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;font-size:13px}
.g{display:inline-grid;place-items:center;width:20px;height:20px;font-size:12px;color:var(--c);background:#120e19;border:2px solid #000;margin-right:3px;vertical-align:middle}
.frow .op{color:var(--dust)}
.frow .res{color:var(--gold)}
.frow .met{color:var(--moss)}
.fcard p{margin:0;font-size:13px;line-height:1.6}
.fcard .st{font-size:12px;color:var(--dust)}
.fcard .st.ok{color:var(--gold)}
.kind{font-size:11px;color:var(--ink);background:var(--c);padding:0 5px;align-self:flex-start}
details.fcard summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;font-size:15px}
details.fcard summary::-webkit-details-marker{display:none}
details.fcard summary::after{content:"＋";margin-left:auto;color:var(--dust)}
details.fcard[open] summary::after{content:"－"}
details.fcard ol{margin:0;padding-left:20px;font-size:13px;line-height:1.7}
.tile{display:flex;gap:10px;align-items:flex-start}
.tile img{width:32px;height:32px;image-rendering:pixelated;border:2px solid #000;flex:none}
.tile .en{width:40px;height:40px;object-fit:contain;background:#120e19}
.codex{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:2px 14px;font-size:13px;line-height:1.7}
.codex li.no{color:#5d5270}
.codex li.run::before{content:"● ";color:var(--volt)}
@media (max-width:520px){.lede{font-size:14px}.card .ds{font-size:12px}}
</style>

<canvas id="cv"></canvas>

<div id="hud" hidden>
  <div id="xpbar"><i id="xpfill"></i></div>
  <div class="hudrow">
    <div class="vit">
      <div class="hpline"><span id="lvl">LV 1</span><div class="hpbar"><i id="hpfill"></i></div><span id="hptext">100/100</span></div>
      <div id="weps"></div>
    </div>
    <div class="clock"><div id="stage">第 1 關</div><div id="timer">00:00</div><div id="kills">擊殺 0</div></div>
    <div class="tools"><button class="tbtn" id="musBtn" type="button" aria-pressed="true">音樂</button><button class="tbtn" id="codexBtn" type="button">圖鑑</button><button class="tbtn" id="pauseBtn" type="button">暫停</button></div>
  </div>
  <div id="terrain">腳下：草地</div>
</div>
<div id="toasts"></div>
<div id="joy" hidden><div id="knob"></div></div>

<div id="scrTitle" class="screen">
  <div class="slab">
    <p class="eyebrow">像素倖存者 · 可破壞的元素地形</p>
    <h1>元素荒原</h1>
    <p class="lede">闖過四片荒原。你放出的每一招都會改寫地形：<em>燒光森林、凍住湖面、震出坑洞</em>。坑洞會被旁邊的水、熔岩、毒液灌滿，熔岩碰到水變成黑曜石，灰燼吸了水長出能回血的花。法術練滿後還能進化，或兩兩合成更強的法術。</p>
    <div class="route" id="route"></div>
    <div class="row"><h2>難度</h2><button class="btn alt" id="titleCodex" type="button">圖鑑與合成公式</button></div>
    <div class="seg" id="diffSeg"></div>
    <p class="hint" id="diffDesc"></p>
    <h2>選擇職業</h2>
    <div id="classGrid" class="cards"></div>
    <div class="seg snd"><button type="button" class="musT" style="--c:var(--tide)">音樂</button><button type="button" class="sfxT" style="--c:var(--tide)">音效</button></div>
    <p class="keys">移動：<kbd>WASD</kbd> 或方向鍵；手機按住畫面任意處拖曳。攻擊會自動施放。暫停：<kbd>ESC</kbd> 或 <kbd>SPACE</kbd>。升級時按 <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> 快速選擇。</p>
  </div>
</div>

<div id="scrLevel" class="screen" hidden>
  <div class="slab">
    <p class="eyebrow" id="lvEyebrow">等級提升</p>
    <h2 style="font-size:24px;margin:0">選一項強化</h2>
    <div id="lvCards" class="cards"></div>
  </div>
</div>

<div id="scrPause" class="screen" hidden>
  <div class="slab">
    <p class="eyebrow" id="pauseEyebrow">暫停</p>
    <div class="btns"><button class="btn" id="resumeBtn" type="button">繼續</button><button class="btn alt" id="pauseCodex" type="button">圖鑑與合成公式</button><button class="btn alt" id="restartBtn" type="button">從第 1 關重來</button><button class="btn alt" id="menuBtn" type="button">回主選單</button></div>
    <div class="seg snd"><button type="button" class="musT" style="--c:var(--tide)">音樂</button><button type="button" class="sfxT" style="--c:var(--tide)">音效</button></div>
    <div id="pauseBuild"></div>
  </div>
</div>

<div id="scrCodex" class="screen" hidden>
  <div class="slab">
    <div class="row"><h2 style="font-size:24px;margin:0">圖鑑</h2><button class="btn alt" id="codexBack" type="button">返回</button></div>
    <div class="tabs" role="tablist" id="tabs">
      <button class="tab" role="tab" type="button" data-tab="form">合成進化</button>
      <button class="tab" role="tab" type="button" data-tab="spell">法術</button>
      <button class="tab" role="tab" type="button" data-tab="react">地形反應</button>
      <button class="tab" role="tab" type="button" data-tab="tile">地形</button>
      <button class="tab" role="tab" type="button" data-tab="foe">敵人與關卡</button>
    </div>
    <div id="codexBody"></div>
  </div>
</div>

<div id="scrClear" class="screen" hidden>
  <div class="slab">
    <p class="eyebrow" id="clrEyebrow">第 1 關通關</p>
    <h1 id="clrTitle" style="font-size:clamp(32px,8vw,50px);color:var(--moss);text-shadow:3px 3px 0 #1f4d1d,6px 6px 0 #000">撐過了翠綠草原</h1>
    <div class="stats" id="clrStats"></div>
    <div class="next" id="clrNext"></div>
    <div class="btns"><button class="btn" id="nextBtn" type="button">前往下一關</button><button class="btn alt" id="clrCodex" type="button">先看圖鑑</button></div>
  </div>
</div>

<div id="scrEnd" class="screen" hidden>
  <div class="slab">
    <p class="eyebrow" id="endEyebrow">戰鬥結束</p>
    <h1 id="endTitle" style="font-size:clamp(34px,8vw,52px)">你倒下了</h1>
    <div class="stats" id="endStats"></div>
    <div class="btns"><button class="btn" id="againBtn" type="button">再玩一次</button><button class="btn alt" id="endMenuBtn" type="button">回主選單</button></div>
  </div>
</div>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
const TAU=Math.PI*2,R=Math.random;
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let VW=320,VH=180,SC=3,vign=null;
function resize(){
  const w=innerWidth,h=innerHeight;
  SC=Math.max(2,Math.floor(Math.min(w,h)/170));
  VW=Math.ceil(w/SC);VH=Math.ceil(h/SC);
  cv.width=VW;cv.height=VH;cv.style.width=VW*SC+'px';cv.style.height=VH*SC+'px';
  ctx.imageSmoothingEnabled=false;
  vign=document.createElement('canvas');vign.width=VW;vign.height=VH;
  const g=vign.getContext('2d'),gr=g.createRadialGradient(VW/2,VH/2,Math.min(VW,VH)*.35,VW/2,VH/2,Math.max(VW,VH)*.75);
  gr.addColorStop(0,'rgba(8,5,14,0)');gr.addColorStop(1,'rgba(8,5,14,.55)');g.fillStyle=gr;g.fillRect(0,0,VW,VH);
}
addEventListener('resize',resize);resize();

// ---------- noise ----------
function hash(x,y,s){let h=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263)+Math.imul(s|0,982451653))|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967296}
function vnoise(x,y,s){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);const a=hash(xi,yi,s),b=hash(xi+1,yi,s),c=hash(xi,yi+1,s),d=hash(xi+1,yi+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
function fbm(x,y,s){return (vnoise(x,y,s)*.6+vnoise(x*2.03,y*2.03,s+7)*.28+vnoise(x*4.1,y*4.1,s+13)*.12)*2-1}

// ---------- tiles ----------
const T={GRASS:0,DIRT:1,SAND:2,WATER:3,STONE:4,TREE:5,FIRE:6,ASH:7,MUD:8,ICE:9,LAVA:10,OBSIDIAN:11,STEAM:12,GLASS:13,CRATER:14,POISON:15,CRYSTAL:16,FLOWER:17,SHOCK:18,FERTILE:19};
const NT=20;
// sl = speed mult for both; pm/em override for player/enemy; ed/pd = damage per second to enemy/player
const TP=[
  {n:'草地',d:'一般地面，會被火點燃。'},
  {n:'泥土',d:'一般地面。澆水變泥沼，放著不管會長回草地。'},
  {n:'沙地',pm:.9,em:.85,d:'稍微減速。被火或雷燒成玻璃。'},
  {n:'水',pm:.6,em:.5,d:'大幅減速。火→蒸氣、冰→冰面、雷→整片帶電。會流進相鄰的坑洞。'},
  {n:'岩石',solid:1,hp:3,d:'擋路的牆。被大地攻擊擊碎，被隕石砸中熔成熔岩。'},
  {n:'樹木',solid:1,hp:2,d:'擋路的牆。容易起火，火勢會在樹林間蔓延。'},

let SEED=1,BIOME='plains';const chunks=new Map();let lastK=-1,lastC=null;
function genTile(wx,wy,base){
  if(wx*wx+wy*wy<=40)return base;
  const e=fbm(wx/26,wy/26,SEED),m=fbm(wx/38,wy/38,SEED+101),p=fbm(wx/16,wy/16,SEED+202),r=hash(wx,wy,SEED+5);
  switch(BIOME){
    case 'volcano':
      if(e<-0.45)return T.WATER;
      if(e>0.36)return p>0.1?T.LAVA:(r<.08?T.OBSIDIAN:T.STONE);
      if(e>0.28)return r<.6?T.STONE:T.ASH;
      if(p>0.42)return T.LAVA;
      if(m>0.3&&r<.15)return T.TREE;
      if(m>0.18)return r<.55?T.GRASS:T.DIRT;
      if(r<.22)return T.ASH;if(r<.235)return T.OBSIDIAN;
      if(m<-0.35)return T.SAND;
      return T.DIRT;
    case 'frost':
      if(e<-0.2)return m>-0.05?T.ICE:T.WATER;
      if(e<-0.13)return T.MUD;
      if(e>0.4)return r<.05?T.CRYSTAL:T.STONE;
      if(p<-0.42)return T.POISON;
      if(m>0.2&&r<(m-0.2)*1.8)return T.TREE;
      if(r<.04)return T.ICE;if(r<.06)return T.FLOWER;
      return m<-0.2&&r<.3?T.MUD:T.GRASS;
    case 'abyss':
      if(e<-0.33)return T.WATER;
      if(e>0.35)return r<.1?T.CRYSTAL:T.OBSIDIAN;
      if(e>0.26)return r<.18?T.CRYSTAL:T.DIRT;
      if(p<-0.4)return T.POISON;
      if(p>0.45)return T.LAVA;
      if(r<.012)return T.OBSIDIAN;
      if(r<.05)return T.GLASS;
      if(m>0.3&&r<.25)return T.GRASS;
      if(r<.3)return T.ASH;
      return T.DIRT;
    default:
      if(e<-0.36)return T.WATER;
      if(e<-0.29)return T.SAND;
      if(e>0.40)return p>0.35?T.LAVA:(r<.05?T.CRYSTAL:T.STONE);
      if(e>0.33)return r<.55?T.STONE:T.DIRT;
      if(m<-0.42)return r<.02?T.STONE:T.SAND;
      if(p<-0.4&&m>-0.15)return T.POISON;
      if(m>0.05&&r<(m-0.05)*1.9)return T.TREE;
      if(r<.025)return T.FLOWER;
      if(m<0&&r<.07)return T.DIRT;
      return T.GRASS;
  }
}
function gen(cx,cy){
  const t=new Uint8Array(1024),tm=new Float32Array(1024),hp=new Uint8Array(1024),base=state==='title'?T.GRASS:ST().base;
  for(let ly=0;ly<32;ly++)for(let lx=0;lx<32;lx++){const v=genTile(cx*32+lx,cy*32+ly,base),i=ly*32+lx;t[i]=v;hp[i]=TP[v].hp||0}
  return {t,tm,hp};
}
function getChunk(cx,cy){const k=(cx+30000)*60000+(cy+30000);if(k===lastK)return lastC;let c=chunks.get(k);if(!c){c=gen(cx,cy);chunks.set(k,c)}lastK=k;lastC=c;return c}
const tget=(tx,ty)=>getChunk(tx>>5,ty>>5).t[((ty&31)<<5)|(tx&31)];
function tset(tx,ty,type,tm){const c=getChunk(tx>>5,ty>>5),i=((ty&31)<<5)|(tx&31);c.t[i]=type;c.tm[i]=tm||0;c.hp[i]=TP[type].hp||0}
const tileUnder=(x,y)=>tget(Math.floor(x/8),Math.floor(y/8));
const solidAt=(x,y)=>TP[tileUnder(x,y)].solid;
const blocked=(x,y,r)=>solidAt(x-r,y-r)||solidAt(x+r,y-r)||solidAt(x-r,y+r)||solidAt(x+r,y+r);
function moveEnt(e,dx,dy){
  if(blocked(e.x,e.y,e.r)){e.x+=dx;e.y+=dy;return false}
  let hit=false;
  if(dx){if(!blocked(e.x+dx,e.y,e.r))e.x+=dx;else hit=true}
  if(dy){if(!blocked(e.x,e.y+dy,e.r))e.y+=dy;else hit=true}
  return hit;
}
function tilesIn(x,y,rad,fn){
  const x0=Math.floor((x-rad)/8),x1=Math.floor((x+rad)/8),y0=Math.floor((y-rad)/8),y1=Math.floor((y+rad)/8);
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){const d=Math.hypot(tx*8+4-x,ty*8+4-y);if(d<=rad+2)fn(tx,ty,d)}
}

function paintTile(t,v,f,ox,oy){
  let sb=t*977+v*131+7,sa=t*577+v*61+f*1013+3;
  const rb=()=>(sb=(sb*16807)%2147483647)/2147483647;
  const ra=()=>(sa=(sa*16807)%2147483647)/2147483647;
  for(let k=0;k<4;k++){rb();ra()}
  const P=(x,y,c)=>{ac.fillStyle=c;ac.fillRect(ox+(x&7),oy+(y&7),1,1)};
  const fill=c=>{ac.fillStyle=c;ac.fillRect(ox,oy,8,8)};
  const speck=(c,d)=>{for(let y=0;y<8;y++)for(let x=0;x<8;x++)if(rb()<d)P(x,y,c)};
  const grass=()=>{fill('#4a8f3a');speck('#3e7c30',.22);speck('#5ba449',.1);for(let k=0;k<2;k++){const x=1+(rb()*6|0),y=1+(rb()*5|0);P(x,y,'#74c25a');P(x,y+1,'#5ba449')}};
  switch(t){
    case T.GRASS:grass();break;
    case T.DIRT:fill('#7a5536');speck('#684629',.25);speck('#8c6542',.12);break;
    case T.SAND:fill('#d9c27c');speck('#c6ad68',.22);speck('#ecd99c',.12);break;
    case T.WATER:case T.SHOCK:{
      fill(t===T.SHOCK?'#2a5aa0':'#2e68b0');speck('#285c9e',.18);
      for(let k=0;k<2;k++){const y=(k*4+f+v)%8,x0=(v*3+k*4)%6;for(let x=0;x<3;x++)P(x0+x,y,'#5f9fe6')}
      if(t===T.SHOCK){let x=ra()*8|0;for(let y=0;y<8;y++){P(x,y,'#fff59a');x=(x+(ra()<.5?1:7))%8}P(ra()*8|0,ra()*8|0,'#ffffff')}
      break}
    case T.STONE:fill('#7f8190');speck('#6f7180',.2);for(let x=0;x<8;x++){P(x,0,'#a4a6b5');P(x,1,'#9294a3');P(x,7,'#4c4e5b')}for(let y=2;y<7;y++){P(0,y,'#8e909f');P(7,y,'#5e606d')}break;
    case T.TREE:{grass();P(3,6,'#5b3a22');P(4,6,'#4a2f1b');P(3,7,'#5b3a22');P(4,7,'#4a2f1b');
      for(let y=0;y<6;y++)for(let x=0;x<8;x++){const dx=x-3.5,dy=y-2.6,d=dx*dx+dy*dy;if(d<11){let c='#2f6b2a';if(dx+dy<-2.2)c='#4b9a3e';else if(dx+dy>2.4)c='#1f4d1d';if(rb()<.12)c='#3d8236';P(x,y,c)}}break}
    case T.FIRE:fill('#3a2418');speck('#2a1911',.3);
      for(let x=0;x<8;x++){const h=2+(ra()*5|0);for(let k=0;k<h;k++)P(x,7-k,k<h*.4?'#c2361a':k<h*.75?'#f2781f':'#ffd34a')}break;
    case T.ASH:fill('#56515a');speck('#6c6770',.22);speck('#403b44',.18);break;
    case T.MUD:fill('#4e3925');speck('#3e2d1d',.28);speck('#6b5538',.07);break;
    case T.ICE:fill('#a9dcef');speck('#93cde3',.18);for(let k=0;k<4;k++)P((v*2+k)%8,(k+v*3)%8,'#eefaff');for(let x=0;x<8;x++)P(x,7,'#86bfd6');break;
    case T.LAVA:fill('#c4410e');speck('#7d2a10',.1);for(let y=0;y<8;y++)for(let x=0;x<8;x++)if(ra()<.28)P(x,y,'#f47a16');for(let k=0;k<2;k++)P(ra()*8|0,ra()*8|0,'#ffe066');break;
    case T.OBSIDIAN:fill('#251b35');speck('#2f2344',.25);for(let x=0;x<8;x++){P(x,0,'#43325e');P(x,1,'#382a50');P(x,7,'#120c1c')}P(2+v,3,'#9a7ad6');P(3+v,4,'#6d52a3');break;
    case T.STEAM:fill('#4a3a2c');speck('#3b2e23',.2);for(let k=0;k<3;k++){const x=ra()*8|0,y=ra()*8|0;P(x,y,'#eef2f7');P(x+1,y,'#cfd6df');P(x,y+1,'#cfd6df');P(x-1,y,'#b8c0cb')}break;
    case T.GLASS:fill('#9ed8cf');speck('#b8ebe3',.18);for(let k=0;k<3;k++)P(k+v+1,5-k,'#f2fffd');for(let x=0;x<8;x++)P(x,7,'#79bdb2');break;

    case T.POISON:fill('#4a2c5b');speck('#5c3870',.25);speck('#3a2048',.12);for(let k=0;k<2;k++){const x=ra()*7|0,y=ra()*7|0;P(x,y,'#a6e35f');P(x+1,y,'#7cc24a')}break;
    case T.CRYSTAL:{fill('#2e2a3a');speck('#3a3548',.2);const sh=[[1,5,'#67e8f9'],[2,6,'#a5f3fc'],[4,7,'#c084fc'],[5,5,'#e9d5ff'],[6,4,'#67e8f9']];

    case T.FERTILE:fill('#3d2b1c');speck('#2e2015',.25);for(let k=0;k<3;k++){const x=1+(rb()*6|0),y=2+(rb()*5|0);P(x,y,'#5aa547');P(x-1,y-1,'#7ccf5c');P(x+1,y-1,'#7ccf5c')}break;
  }
}

    fx(name){

        case 'hurt':tone(sfx,'square',47,t,.16,.12,{slide:-7,lp:1200});break;
        case 'horn':tone(sfx,'sawtooth',38,t,1,.16,{a:.12,lp:520});tone(sfx,'sawtooth',45,t+.06,1,.11,{a:.12,lp:520});break;
        case 'chime':tone(sfx,'triangle',88,t,.25,.06);tone(sfx,'triangle',95,t+.08,.3,.05);break;
        case 'level':[72,76,79,84].forEach((m,k)=>tone(sfx,'square',m,t+k*.07,.16,.07,{lp:4000}));break;
        case 'evolve':[60,64,67,72,76,79,84].forEach((m,k)=>tone(sfx,'square',m,t+k*.06,.3,.06,{lp:4500}));tone(sfx,'triangle',48,t,.9,.22);break;
        case 'clear':[67,72,76,79,84,79,84].forEach((m,k)=>tone(sfx,'square',m,t+k*.11,k===6?.7:.14,.07,{lp:4000}));break;
        case 'win':[60,64,67,72,67,72,76,79,84].forEach((m,k)=>tone(sfx,'square',m,t+k*.12,k===8?1.2:.16,.07,{lp:4000}));tone(sfx,'triangle',48,t+.96,1.2,.2);break;
        case 'lose':[64,62,60,55,52].forEach((m,k)=>tone(sfx,'triangle',m,t+k*.2,.4,.12));break;
      }
    },
  };

})();

// ---------- element reactions ----------
function applyEl(tx,ty,el,pow=1,crater=0){
  const c=getChunk(tx>>5,ty>>5),i=((ty&31)<<5)|(tx&31),t=c.t[i];
  const S=(nt,tm)=>{c.t[i]=nt;c.tm[i]=tm||0;c.hp[i]=TP[nt].hp||0};
  if(el==='fire'){
    if(t===T.GRASS||t===T.FLOWER||t===T.FERTILE){S(T.FIRE,3+R()*2);disc('f:grass')}
    else if(t===T.TREE){S(T.FIRE,6+R()*3);disc('f:tree')}
    else if(t===T.WATER||t===T.SHOCK){S(T.STEAM,2.5+R()*1.5);disc('f:water')}
    else if(t===T.ICE){S(T.WATER);disc('f:ice')}
    else if(t===T.SAND){if(R()<.5){S(T.GLASS);disc('f:sand')}}
    else if(t===T.MUD){S(T.DIRT);disc('f:mud')}
    else if(t===T.POISON){S(T.FIRE,.4);booms.push({tx,ty,t:.05});disc('f:poison')}
  }else if(el==='ice'){
    if(t===T.WATER||t===T.SHOCK){S(T.ICE);disc('i:water')}
    else if(t===T.LAVA){S(T.OBSIDIAN);disc('i:lava');burst(tx*8+4,ty*8+4,4,['#e5e7eb','#9ca3af'],20)}
    else if(t===T.FIRE){S(T.ASH);disc('i:fire')}
    else if(t===T.STEAM){S(T.WATER);disc('i:steam')}
    else if(t===T.MUD){S(T.ICE);disc('i:mud')}
    else if(t===T.POISON){S(T.ICE);disc('i:poison')}
  }else if(el==='earth'){
    if(t===T.STONE||t===T.OBSIDIAN||t===T.CRYSTAL){
      const nh=c.hp[i]-pow;
      if(nh<=0){
        const col=t===T.STONE?'#9a9cab':t===T.OBSIDIAN?'#5b4686':'#a5f3fc';
        if(t===T.CRYSTAL){S(T.GLASS);for(let k=0;k<4;k++)dropGem(tx*8+4,ty*8+4,2);disc('e:crystal')}
        else{S(T.DIRT);disc(t===T.STONE?'e:stone':'e:obsidian')}
        burst(tx*8+4,ty*8+4,6,[col,'#2a2a30'],35);
      }else c.hp[i]=nh;
    }
    else if(t===T.TREE){S(T.DIRT);disc('e:tree');burst(tx*8+4,ty*8+4,5,['#3d8236','#5b3a22'],30)}
    else if(t===T.ICE){S(T.WATER);disc('e:ice');burst(tx*8+4,ty*8+4,4,['#eefaff','#a9dcef'],30)}
    else if(t===T.GLASS){S(T.SAND);disc('e:glass')}
    else if(crater>0&&isGround(t)&&t!==T.CRATER&&R()<crater){S(T.CRATER);disc('e:ground')}
  }else if(el==='bolt'){
    if(t===T.WATER||t===T.SHOCK){electrify(tx,ty);disc('l:water')}
    else if(t===T.SAND){S(T.GLASS);disc('l:sand')}
    else if(t===T.TREE){S(T.FIRE,6+R()*3);disc('l:tree')}
    else if(t===T.GRASS&&R()<.3){S(T.FIRE,3);disc('f:grass')}
    else if(t===T.OBSIDIAN){S(T.CRYSTAL);disc('l:obsidian')}
    else if(t===T.POISON){S(T.FIRE,.4);booms.push({tx,ty,t:.05});disc('l:poison')}
  }else if(el==='water'){
    if(t===T.FIRE){S(T.ASH);disc('w:fire');part(tx*8+4,ty*8+2,0,-15,.5,'#dfe5ec')}
    else if(t===T.LAVA){S(T.OBSIDIAN);disc('w:lava')}
    else if(t===T.DIRT){S(T.MUD);disc('w:dirt')}
    else if(t===T.ASH){S(T.FERTILE);disc('w:ash')}
    else if(t===T.CRATER){S(T.WATER);disc('w:crater')}
  }
}
function electrify(tx,ty){
  const q=[[tx,ty]],seen=new Set();let n=0;
  while(q.length&&n<90){const [x,y]=q.shift(),k=x*100003+y;if(seen.has(k))continue;seen.add(k);
    const t=tget(x,y);if(t!==T.WATER&&t!==T.SHOCK)continue;tset(x,y,T.SHOCK,1.4);n++;
    if(R()<.15)part(x*8+R()*8,y*8+R()*8,0,-8,.25,'#fff59a');
    q.push([x+1,y],[x-1,y],[x,y+1],[x,y-1])}
}
function boom(tx,ty){
  const x=tx*8+4,y=ty*8+4,rad=20;
  tset(tx,ty,T.CRATER);
  if(state==='play'){
    const d0=40*dmgM();
    for(const e of enemies){if(Math.hypot(e.x-x,e.y-y)<rad+e.r)hitE(e,d0)}
    if(Math.hypot(P.x-x,P.y-y)<rad*.7)hurtPlayer(8*DF().dmg);
  }
  tilesIn(x,y,rad,(ax,ay,d)=>{
    const t=tget(ax,ay);
    if(t===T.POISON){tset(ax,ay,T.FIRE,.4);booms.push({tx:ax,ty:ay,t:.1+R()*.12});disc('a:chain-boom')}
    else if(isFlam(t))tset(ax,ay,T.FIRE,3+R()*2);
    else if(t===T.WATER)tset(ax,ay,T.STEAM,2.5);
    else if(t===T.STONE||t===T.OBSIDIAN||t===T.CRYSTAL)applyEl(ax,ay,'earth',1);
    else if(d<11&&(t===T.DIRT||t===T.SAND||t===T.ASH))tset(ax,ay,T.CRATER);
  });
  fx.push({k:'boom',x,y,r:rad,t:0,max:.3,c:'#b6ff6a'});AU.fx('boom');
  burst(x,y,14,['#b6ff6a','#ff8a3d','#ffe066','#6b3a7a'],70);
  shake(.2,3);
}

// ---------- cellular automata ----------
const NB=[[1,0],[-1,0],[0,1],[0,-1]];
function automata(dt){
  const m=10,x0=Math.floor(cam.x/8)-m,y0=Math.floor(cam.y/8)-m,x1=Math.floor((cam.x+VW)/8)+m,y1=Math.floor((cam.y+VH)/8)+m;
  const ch=[];
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){
    const c=getChunk(tx>>5,ty>>5),i=((ty&31)<<5)|(tx&31),t=c.t[i];
    switch(t){
      case T.FIRE:{
        c.tm[i]-=dt;if(c.tm[i]<=0){ch.push(tx,ty,T.ASH,0,'a:fire-out');break}
        for(const [dx,dy] of NB){const nx=tx+dx,ny=ty+dy,nt=tget(nx,ny);
          if(isFlam(nt)){if(R()<(nt===T.TREE?.03:.012))ch.push(nx,ny,T.FIRE,nt===T.TREE?7:3.5,'a:fire-spread')}
          else if(nt===T.POISON){if(R()<.2)ch.push(nx,ny,-1,0,'a:chain-boom')}
          else if(nt===T.ICE){if(R()<.06)ch.push(nx,ny,T.WATER,0,'a:fire-ice')}}
        break}
      case T.LAVA:{
        if(c.tm[i]>0){c.tm[i]-=dt;if(c.tm[i]<=0){ch.push(tx,ty,T.OBSIDIAN,0,'a:lava-cool');break}}
        for(const [dx,dy] of NB){const nx=tx+dx,ny=ty+dy,nt=tget(nx,ny);
          if(nt===T.WATER||nt===T.SHOCK){if(R()<.25){ch.push(nx,ny,T.STEAM,3,'a:lava-water');ch.push(tx,ty,T.OBSIDIAN,0,null)}}
          else if(isFlam(nt)){if(R()<.01)ch.push(nx,ny,T.FIRE,4,'a:lava-ignite')}
          else if(nt===T.ICE){if(R()<.1)ch.push(nx,ny,T.WATER,0,'a:fire-ice')}
          else if(nt===T.CRATER){if(R()<.12)ch.push(nx,ny,T.LAVA,c.tm[i]>0?Math.max(4,c.tm[i]*.85):25,'a:lava-flow')}}
        break}
      case T.WATER:
        for(const [dx,dy] of NB){const nx=tx+dx,ny=ty+dy,nt=tget(nx,ny);
          if(nt===T.CRATER){if(R()<.15)ch.push(nx,ny,T.WATER,0,'a:water-flow')}
          else if(nt===T.ASH){if(R()<.03)ch.push(nx,ny,T.FERTILE,0,'a:ash-fertile')}}
        break;
      case T.POISON:
        for(const [dx,dy] of NB){const nx=tx+dx,ny=ty+dy;if(tget(nx,ny)===T.CRATER&&R()<.1)ch.push(nx,ny,T.POISON,0,'a:poison-flow')}
        break;
      case T.STEAM:c.tm[i]-=dt;if(c.tm[i]<=0)ch.push(tx,ty,T.CRATER,0,'a:steam-dry');break;
      case T.SHOCK:c.tm[i]-=dt;if(c.tm[i]<=0)ch.push(tx,ty,T.WATER,0,null);break;
      case T.FERTILE:if(R()<.012)ch.push(tx,ty,R()<.5?T.FLOWER:T.GRASS,0,'a:bloom');break;
      case T.ASH:if(R()<.003)ch.push(tx,ty,T.DIRT,0,null);break;
      case T.MUD:if(R()<.004)ch.push(tx,ty,T.DIRT,0,'a:mud-dry');break;
      case T.DIRT:if(BIOME!=='abyss'&&R()<.0012)ch.push(tx,ty,T.GRASS,0,'a:regrow');break;
      case T.CRATER:if(R()<.0006)ch.push(tx,ty,T.DIRT,0,null);break;
    }
  }
  for(let k=0;k<ch.length;k+=5){
    const tx=ch[k],ty=ch[k+1],nt=ch[k+2];
    if(nt===-1){if(tget(tx,ty)===T.POISON){tset(tx,ty,T.FIRE,.4);booms.push({tx,ty,t:.08})}}
    else tset(tx,ty,nt,ch[k+3]);
    if(ch[k+4])disc(ch[k+4]);
  }
}

// ---------- player / combat ----------
function newPlayer(cls){
  return {x:4,y:4,r:3,hp:cls.hp,maxhp:cls.hp,spd:52*cls.spd,face:1,dir:0,inv:0,flash:0,xp:0,lvl:1,next:xpNeed(1),
    weps:{[cls.w]:{lv:1,t:.4,a:0}},pas:{},used:new Set(),regen:cls.regen||0,moving:false,walkT:0};
}
function heal(a){P.hp=Math.min(P.maxhp,P.hp+a)}
function hurtPlayer(d,cont){
  if(state!=='play')return;
  if(cont)P.hp-=d;
  else{if(P.inv>0)return;P.hp-=d;P.inv=.6;P.flash=.12;AU.fx('hurt');shake(.12,1.5);burst(P.x,P.y-4,6,['#e8455a','#ffffff'],30)}
  if(P.hp<=0){P.hp=0;endGame(false)}
}
function dropGem(x,y,v){
  if(gems.length>380){let b=gems[0],bd=1e9;for(const g of gems){const d=(g.x-x)**2+(g.y-y)**2;if(d<bd){bd=d;b=g}}b.v+=v;return}
  gems.push({x:x+(R()-.5)*5,y:y+(R()-.5)*5,v,m:0});
}
function freeze(e,t){if(e.d.iceImm)return;e.frozen=Math.max(e.frozen,e.d.boss?t*.35:t)}
function hitE(e,d,quiet){
  if(e.dead)return;
  e.hp-=d;if(!quiet)e.flash=.08;
  if(e.hp<=0){
    e.dead=true;kills++;stageKills++;
    dropGem(e.x,e.y,e.d.xp);
    if(e.d.boss){for(let k=0;k<6;k++)dropGem(e.x,e.y,10);heal(P.maxhp*.5);pendingLv++;toast('巨像倒下：額外升級一次，生命回復一半','gold');shake(.4,4)}
    else if(R()<.012)pickups.push({x:e.x,y:e.y,k:'heal'});
    if(e.d.pool){let made=false;tilesIn(e.x,e.y,9,(tx,ty)=>{const t=tget(tx,ty);if(isGround(t)||t===T.WATER){tset(tx,ty,T.POISON);made=true}});if(made)disc('x:toad')}
    burst(e.x,e.y-3,e.d.boss?30:6,e.d.col,e.d.boss?80:35);
  }
}
function gainXP(v){P.xp+=v*DF().xp;while(P.xp>=P.next){P.xp-=P.next;P.lvl++;P.next=xpNeed(P.lvl);pendingLv++}}
function targets(n,maxd,minD=0){
  const a=[];for(const e of enemies){if(e.dead)continue;const d=(e.x-P.x)**2+(e.y-P.y)**2;if(d<maxd*maxd&&d>=minD*minD)a.push([d,e])}
  a.sort((p,q)=>p[0]-q[0]);return a.slice(0,n).map(p=>p[1]);
}
function onScreen(){return enemies.filter(e=>!e.dead&&Math.abs(e.x-P.x)<VW*.55&&Math.abs(e.y-P.y)<VH*.55)}
function boltFx(x,y){
  const pts=[];const px=x+(R()-.5)*30,py=cam.y-8,steps=7;
  for(let k=0;k<=steps;k++){const f=k/steps;pts.push([px+(x-px)*f+(k&&k<steps?(R()-.5)*10:0),py+(y-py)*f])}
  fx.push({k:'bolt',pts,t:0,max:.18,x,y});
  burst(x,y,8,['#fff59a','#ffffff','#7fd8f0'],50);
}
function strike(x,y,big){
  boltFx(x,y);AU.fx('zap');
  const tx=Math.floor(x/8),ty=Math.floor(y/8);
  applyEl(tx,ty,'bolt');
  if(big){for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++)if(a||b)applyEl(tx+a,ty+b,'bolt')}
  else for(const [dx,dy] of NB)if(R()<.4)applyEl(tx+dx,ty+dy,'bolt');
}
function lightning(n,chn,dmg,big){
  const rr=55*areaM(),near=targets(n*2,110),c=near.length>=n?near:onScreen();
  for(let k=0;k<n;k++){let x,y;
    if(c.length){const e=c.splice(R()*c.length|0,1)[0];x=e.x;y=e.y;hitE(e,dmg);
      let cur=e;const hit=new Set([e]);
      for(let j=0;j<chn;j++){let best=null,bd=rr*rr;
        for(const o of enemies){if(hit.has(o)||o.dead)continue;const d=(o.x-cur.x)**2+(o.y-cur.y)**2;if(d<bd){bd=d;best=o}}
        if(!best)break;fx.push({k:'arc',x:cur.x,y:cur.y,x2:best.x,y2:best.y,t:0,max:.16});hitE(best,dmg*.7);hit.add(best);cur=best}}
    else{x=P.x+(R()-.5)*VW*.8;y=P.y+(R()-.5)*VH*.8}
    strike(x,y,big)}
}
function shockwave(rad,dmg,kb,pow,crater,inner,stun){
  for(const e of enemies){const dx=e.x-P.x,dy=e.y-P.y,d=Math.hypot(dx,dy)||1;if(d<rad+e.r){hitE(e,dmg);if(!e.d.boss){e.kx+=dx/d*kb;e.ky+=dy/d*kb}if(stun)e.stun=Math.max(e.stun,e.d.boss?stun*.3:stun)}}
  tilesIn(P.x,P.y,rad,(tx,ty,d)=>applyEl(tx,ty,'earth',pow,d>rad-12?crater:inner));
  fx.push({k:'ring',x:P.x,y:P.y,r:rad,t:0,max:.3,c:'#d9a866'});shake(.18,stun?4:2.5);AU.fx('thud');
  for(let k=0;k<18;k++){const a=R()*TAU;part(P.x+Math.cos(a)*rad*.9,P.y+Math.sin(a)*rad*.9,Math.cos(a)*20,Math.sin(a)*20-10,.5,R()<.5?'#a07a4a':'#6b5236')}
}
function orbit(w,dt,o){
  w.a+=o.sp*dt;w.wt=(w.wt||0)-dt;const wet=w.wt<=0;if(wet)w.wt=o.wet;
  w.orbs=[];w.style=o.style;
  for(let k=0;k<o.n;k++){const a=w.a+k*TAU/o.n,x=P.x+Math.cos(a)*o.rad,y=P.y+Math.sin(a)*o.rad*.8;w.orbs.push({x,y});
    for(const e of enemies){if(e.dead||e.tcd>time)continue;const dx=e.x-x,dy=e.y-y;
      if(dx*dx+dy*dy<(e.r+o.hr)**2){hitE(e,o.dmg);e.tcd=time+.45;if(!e.d.boss){const d=Math.hypot(dx,dy)||1;e.kx+=dx/d*50;e.ky+=dy/d*50}if(o.onHit)o.onHit(e);part(x,y-4,(R()-.5)*30,(R()-.5)*30,.3,o.pc)}}
    if(wet)o.onWet(Math.floor(x/8),Math.floor(y/8))}
}
const cool=(w,dt,cd)=>{w.t-=dt;if(w.t>0)return false;w.t=cd*cdM();return true};
function fireballs(n,dmg,rad,big){
  const tg=targets(n,big?200:170);
  for(let k=0;k<n;k++){const e=tg[k];let a;
    if(e)a=Math.atan2(e.y-P.y,e.x-P.x);
    else if(tg[0])a=Math.atan2(tg[0].y-P.y,tg[0].x-P.x)+(k%2?.35:-.35)*(1+(k>>1));

      if(!(e.d.iceImm&&tt===T.ICE))spd*=mulOf(tp,false);
      if(tp.ed&&!(e.d.fireImm&&(tt===T.FIRE||tt===T.LAVA)))hitE(e,tp.ed*dt*tdm,true)}
    if(e.dead)continue;
    if(e.frozen>0||e.stun>0){e.frozen-=dt;e.stun-=dt;continue}
    e.anim+=dt;
    if(e.chill>0){if(!e.d.iceImm)spd*=.5;e.chill-=dt}
    if(e.d.trail){e.tr-=dt;if(e.tr<=0){e.tr=.2;const tx=Math.floor(e.x/8),ty=Math.floor(e.y/8),b=tget(tx,ty);

  }

    for(let gx=-1;gx<=1;gx++)for(let gy=-1;gy<=1;gy++){const a=grid.get(ck(cx+gx,cy+gy));if(!a)continue;
      for(const o of a){if(o===e)continue;const ddx=e.x-o.x,ddy=e.y-o.y,dd=ddx*ddx+ddy*ddy,rr=e.r+o.r;
        if(dd<rr*rr){if(dd<.0001){px+=R()-.5;py+=R()-.5;continue}const dl=Math.sqrt(dd),f=(rr-dl)*.25*(o.d.boss?2:1)*(e.d.boss?.1:1);px+=ddx/dl*f;py+=ddy/dl*f}}}
    if(px||py){if(e.d.fly||e.d.ghost){e.x+=px;e.y+=py}else moveEnt(e,px,py)}
  }
}
function updateProjs(dt){

    if(p.k==='fire'){
      if(R()<.7)part(p.x,p.y-4,(R()-.5)*12,(R()-.5)*12,.25,R()<.5?'#ffd34a':'#ff7a1f');
      if(p.big){p.tt-=dt;if(p.tt<=0){p.tt=.04;applyEl(Math.floor(p.x/8),Math.floor(p.y/8),'fire')}}
      let hit=p.life<=0||solidAt(p.x,p.y);
      if(!hit)for(const e of enemies){if(!e.dead&&(e.x-p.x)**2+(e.y-p.y)**2<(e.r+p.r)**2){hit=true;break}}
      if(hit){explodeFire(p);p.dead=true}
    }else if(p.k==='ice'){
      p.fz-=dt;if(p.fz<=0){p.fz=.04;applyEl(Math.floor(p.x/8),Math.floor(p.y/8),'ice')}

const keys={};
let joy=null;
function update(dt){
  time+=dt;total+=dt;
  let ix=0,iy=0;
  if(keys.KeyA||keys.ArrowLeft)ix--;if(keys.KeyD||keys.ArrowRight)ix++;if(keys.KeyW||keys.ArrowUp)iy--;if(keys.KeyS||keys.ArrowDown)iy++;
  if(joy){ix+=joy.dx;iy+=joy.dy}
  const il=Math.hypot(ix,iy);if(il>1){ix/=il;iy/=il}
  const tp=TP[tileUnder(P.x,P.y)];
  const sp=P.spd*(1+.08*(P.pas.swift||0))*mulOf(tp,true);
  moveEnt(P,ix*sp*dt,iy*sp*dt);
  P.moving=il>.15;if(P.moving){P.walkT+=dt;P.dir=Math.atan2(iy,ix);if(Math.abs(ix)>.1)P.face=ix<0?-1:1}
  if(tp.pd)hurtPlayer(tp.pd*dt*DF().dmg,true);
  if(state!=='play')return;
  if(tp.heal)heal(tp.heal*dt);
  heal((P.regen+.4*(P.pas.regen||0))*dt);
  P.inv-=dt;P.flash-=dt;

  for(const id in P.weps)WF[id](P.weps[id],dt);
  updateSpawns(dt);
  updateEnemies(dt);
  if(state!=='play')return;
  updateProjs(dt);
  for(const m of meteors){m.t+=dt;if(m.t>=m.max){m.done=1;impact(m)}else if(m.t>0&&m.kind!=='erupt'&&R()<.5)part(m.x+(1-m.t/m.max)*50,m.y-(1-m.t/m.max)*140,0,0,.3,m.kind==='comet'?'#bff4ff':'#ff8a3d')}
  meteors=meteors.filter(m=>!m.done);
  common(dt);
  const mag=36*(1+.3*(P.pas.magnet||0));
  for(const g of gems){const dx=P.x-g.x,dy=P.y-g.y,d=Math.hypot(dx,dy)||1;
    if(g.m||d<mag){g.m=1;const s=Math.min(d,(90+d*2)*dt);g.x+=dx/d*s;g.y+=dy/d*s}
    if(d<5){g.done=1;gainXP(g.v);AU.fx('gem')}}
  gems=gems.filter(g=>!g.done);
  for(const h of pickups){if(Math.hypot(P.x-h.x,P.y-h.y)<8){h.done=1;heal(25);burst(h.x,h.y-3,6,['#ff6b8a','#ffffff'],25)}}
  pickups=pickups.filter(h=>!h.done);
  enemies=enemies.filter(e=>!e.dead);
  if(state!=='play')return;
  hudAcc+=dt;if(hudAcc>.1){hudAcc=0;hud()}
  if(time>=ST().len){stageClear();return}
  if(pendingLv>0)openLevel();
}
function common(dt){

// ---------- render ----------
function drawSet(set,fi,x,y,flip,mode,scale,alpha){
  const fr=set[fi%set.length],img=mode==='w'?(flip?fr.wf:fr.w):mode==='i'?(flip?fr.if:fr.i):(flip?fr.f:fr.n),w=fr.n.width*scale,h=fr.n.height*scale;
  if(alpha)ctx.globalAlpha=alpha;
  ctx.drawImage(img,Math.round(x-w/2-cam.x),Math.round(y-h+2*scale-cam.y),w,h);
  if(alpha)ctx.globalAlpha=1;
}
function shadow(x,y,w){ctx.fillStyle='rgba(0,0,0,.32)';ctx.fillRect(Math.round(x-w/2-cam.x),Math.round(y+1-cam.y),Math.round(w),2)}
const ORB={tide:['#1f6fb8','#4fb8f0','#e6f7ff'],spring:['#1f8f78','#5fe0c0','#f0fff8'],blizzard:['#7fb8d8','#e6f7ff','#ffffff'],tempest:['#1f5fb8','#4fb8f0','#fff59a']};
function render(){
  const fx0=P?P.x:tcam.x,fy0=P?P.y:tcam.y;
  const sx=shakeT>0?(R()-.5)*shakeM*2:0,sy=shakeT>0?(R()-.5)*shakeM*2:0;
  cam.x=Math.round(fx0-VW/2+sx);cam.y=Math.round(fy0-VH/2+sy);
  ctx.fillStyle='#000';ctx.fillRect(0,0,VW,VH);
  const tx0=Math.floor(cam.x/8),ty0=Math.floor(cam.y/8),tx1=Math.floor((cam.x+VW)/8),ty1=Math.floor((cam.y+VH)/8);
  const fr=(animT*5|0),frF=(animT*10|0);
  const glows=[];
  for(let ty=ty0;ty<=ty1;ty++)for(let tx=tx0;tx<=tx1;tx++){
    const c=getChunk(tx>>5,ty>>5),i=((ty&31)<<5)|(tx&31),t=c.t[i];
    const v=(((tx*73856093)^(ty*19349663))>>>0)%3;
    const f=t===T.FIRE?(frF+v)&3:ANIM.has(t)?(fr+v)&3:0;
    const dx=tx*8-cam.x,dy=ty*8-cam.y;
    ctx.drawImage(atlas,(v*4+f)*8,t*8,8,8,dx,dy,8,8);
    const mh=TP[t].hp;
    if(mh&&c.hp[i]<mh){const dmg=1-c.hp[i]/mh;ctx.fillStyle='rgba(18,14,24,.85)';
      ctx.fillRect(dx+3,dy+2,1,2);ctx.fillRect(dx+4,dy+4,1,1);if(dmg>.3){ctx.fillRect(dx+5,dy+5,1,2);ctx.fillRect(dx+2,dy+4,1,1)}if(dmg>.6){ctx.fillRect(dx+1,dy+6,2,1);ctx.fillRect(dx+6,dy+2,1,2)}}
    if((t===T.FIRE||t===T.LAVA)&&glows.length<1040)glows.push(dx+4,dy+4,t===T.FIRE?.22:.14,0);
    else if(t===T.SHOCK&&glows.length<1040&&(tx+ty+fr)%3===0)glows.push(dx+4,dy+4,.16,1);
  }
  for(const g of gems){const x=Math.round(g.x-cam.x),y=Math.round(g.y-cam.y);if(x<-4||y<-4||x>VW+4||y>VH+4)continue;
    ctx.fillStyle=g.v>=10?'#ff5a7a':g.v>=3?'#7ee06a':'#5fb8ff';ctx.fillRect(x,y-2,1,1);ctx.fillRect(x-1,y-1,3,2);ctx.fillRect(x,y+1,1,1);ctx.fillStyle='#fff';ctx.fillRect(x-1,y-1,1,1)}
  for(const h of pickups){const x=Math.round(h.x-cam.x),y=Math.round(h.y-cam.y)-((animT*4|0)%2);ctx.fillStyle='#e8455a';ctx.fillRect(x-2,y-3,2,2);ctx.fillRect(x+1,y-3,2,2);ctx.fillRect(x-2,y-2,5,2);ctx.fillRect(x-1,y,3,1);ctx.fillRect(x,y+1,1,1);ctx.fillStyle='#ffc2cc';ctx.fillRect(x-1,y-3,1,1)}
  for(const m of meteors){if(m.t<0)continue;const k=m.t/m.max,col=m.kind==='comet'?'150,220,255':m.kind==='erupt'?'255,140,40':'255,80,60';
    ctx.strokeStyle=`rgba(${col},${.4+.4*Math.sin(animT*30)})`;ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(m.x-cam.x,m.y-cam.y,m.rad*k,m.rad*k*.6,0,0,TAU);ctx.stroke();
    if(m.kind!=='erupt'){const rx=Math.round(m.x+(1-k)*50-cam.x),ry=Math.round(m.y-(1-k)*140-cam.y),cs=m.kind==='comet'?['#5fb8e8','#bff4ff','#ffffff']:['#3a2418','#ff8a3d','#ffe066'];
      ctx.fillStyle=cs[0];ctx.fillRect(rx-3,ry-3,6,6);ctx.fillStyle=cs[1];ctx.fillRect(rx-2,ry-2,4,4);ctx.fillStyle=cs[2];ctx.fillRect(rx-1,ry-1,2,2)}}
  enemies.sort((a,b)=>a.y-b.y);
  for(const e of enemies){const sc=e.d.sc||1,spr=e.d.spr,w=spr[0].n.width*sc;
    if(e.x+w<cam.x||e.x-w>cam.x+VW||e.y+20<cam.y||e.y-30>cam.y+VH)continue;
    shadow(e.x,e.y,w*.7);
    const fl=P?P.x<e.x:false,fi=(e.anim*(e.d.fly?8:4))|0;
    drawSet(spr,fi,e.x,e.y,fl,e.flash>0?'w':'',sc,e.d.ghost?.78:0);
    if(e.frozen>0)drawSet(spr,fi,e.x,e.y,fl,'i',sc,.6);
    else if(e.chill>0&&!e.d.iceImm){ctx.fillStyle='rgba(160,230,255,.55)';ctx.fillRect(Math.round(e.x-cam.x)-2,Math.round(e.y-cam.y)-6*sc,4,1)}
    if(e.stun>0&&((animT*8|0)%2)){ctx.fillStyle='#ffe066';ctx.fillRect(Math.round(e.x-cam.x)-2,Math.round(e.y-cam.y)-9*sc,1,1);ctx.fillRect(Math.round(e.x-cam.x)+2,Math.round(e.y-cam.y)-10*sc,1,1)}
    if(e.d.boss){const bw=30,x=Math.round(e.x-bw/2-cam.x),y=Math.round(e.y-26-cam.y);ctx.fillStyle='#000';ctx.fillRect(x-1,y-1,bw+2,4);ctx.fillStyle='#e8455a';ctx.fillRect(x,y,Math.max(0,bw*e.hp/e.maxhp),2)}
  }
  if(P&&state!=='title'){
    shadow(P.x,P.y,7);
    if(!(P.inv>0&&((animT*20|0)%2)))drawSet(PSPR,P.moving?(P.walkT*8|0):0,P.x,P.y,P.face<0,P.flash>0?'w':'',1,0);
    if(P.hp<P.maxhp){const x=Math.round(P.x-6-cam.x),y=Math.round(P.y+4-cam.y);ctx.fillStyle='#000';ctx.fillRect(x-1,y-1,14,3);ctx.fillStyle='#e8455a';ctx.fillRect(x,y,12*P.hp/P.maxhp,1)}
    for(const id in P.weps){const w=P.weps[id];if(!w.orbs)continue;const c=ORB[w.style]||ORB.tide;
      for(const o of w.orbs){const x=Math.round(o.x-cam.x),y=Math.round(o.y-cam.y)-4;
        if(w.style==='blizzard'){ctx.fillStyle=c[0];ctx.fillRect(x-1,y-3,3,7);ctx.fillRect(x-3,y-1,7,3);ctx.fillStyle=c[1];ctx.fillRect(x-1,y-1,3,3);ctx.fillStyle=c[2];ctx.fillRect(x,y-2,1,5);ctx.fillRect(x-2,y,5,1);glows.push(x,y,.25,2)}
        else{ctx.fillStyle=c[0];ctx.fillRect(x-2,y-1,5,3);ctx.fillRect(x-1,y-2,3,5);ctx.fillStyle=c[1];ctx.fillRect(x-1,y-1,3,3);ctx.fillStyle=c[2];ctx.fillRect(x-1,y-1,1,1);if(w.style==='tempest'){ctx.fillRect(x+((animT*20|0)%3)-1,y+1,1,1);glows.push(x,y,.2,1)}}}}
  }
  for(const p of projs){const x=Math.round(p.x-cam.x),y=Math.round(p.y-cam.y)-4;
    if(p.k==='fire'){const s=p.big?1:0;ctx.fillStyle='#c2361a';ctx.fillRect(x-2-s,y-2-s,5+2*s,5+2*s);ctx.fillStyle='#ff7a1f';ctx.fillRect(x-2-s,y-1,5+2*s,3);ctx.fillRect(x-1,y-2-s,3,5+2*s);ctx.fillStyle='#ffe066';ctx.fillRect(x-1,y-1,2+s,2+s);glows.push(x,y,p.big?.45:.3,0)}
    else{const l=Math.hypot(p.vx,p.vy),ux=p.vx/l,uy=p.vy/l;for(let k=0;k<4;k++){ctx.fillStyle=k===0?'#ffffff':k<2?'#bff4ff':'#5fb8e8';ctx.fillRect(Math.round(x-ux*k),Math.round(y-uy*k),1,1)}}}
  for(const f of fx){const k=f.t/f.max;
    if(f.k==='boom'){ctx.globalAlpha=(1-k)*.7;ctx.fillStyle=f.c;ctx.beginPath();ctx.arc(f.x-cam.x,f.y-cam.y-2,f.r*(.45+.55*k),0,TAU);ctx.fill();ctx.globalAlpha=(1-k);ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.stroke();ctx.globalAlpha=1}
    else if(f.k==='ring'){ctx.globalAlpha=1-k;ctx.strokeStyle=f.c;ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(f.x-cam.x,f.y-cam.y,f.r*k,f.r*k*.8,0,0,TAU);ctx.stroke();ctx.globalAlpha=1}
    else if(f.k==='bolt'){ctx.globalAlpha=1-k*.6;ctx.lineWidth=3;ctx.strokeStyle='rgba(255,224,102,.5)';ctx.beginPath();f.pts.forEach((p,j)=>j?ctx.lineTo(p[0]-cam.x,p[1]-cam.y):ctx.moveTo(p[0]-cam.x,p[1]-cam.y));ctx.stroke();ctx.lineWidth=1;ctx.strokeStyle='#fffbe0';ctx.stroke();ctx.globalAlpha=1;glows.push(f.x-cam.x,f.y-cam.y,.5,1)}
    else if(f.k==='arc'){ctx.strokeStyle='#fff59a';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(f.x-cam.x,f.y-cam.y-4);const mx=(f.x+f.x2)/2+(R()-.5)*8,my=(f.y+f.y2)/2+(R()-.5)*8;ctx.lineTo(mx-cam.x,my-cam.y-4);ctx.lineTo(f.x2-cam.x,f.y2-cam.y-4);ctx.stroke()}
  }
  for(const p of parts){ctx.globalAlpha=Math.min(1,p.life/p.max*1.5);ctx.fillStyle=p.c;ctx.fillRect(Math.round(p.x-cam.x),Math.round(p.y-cam.y),1,1)}
  ctx.globalAlpha=1;
  ctx.globalCompositeOperation='lighter';
  for(let k=0;k<glows.length;k+=4){ctx.globalAlpha=glows[k+2];ctx.drawImage(GLOWS[glows[k+3]],glows[k]-16,glows[k+1]-16)}
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
  const tint=state==='title'?null:ST().tint;
  if(tint){ctx.fillStyle=tint;ctx.fillRect(0,0,VW,VH)}
  ctx.drawImage(vign,0,0);
}

const SCREENS=['scrTitle','scrLevel','scrPause','scrEnd','scrClear','scrCodex'];

function scaleURL(src,scale){const o=document.createElement('canvas');o.width=src.width*scale;o.height=src.height*scale;const g=o.getContext('2d');g.imageSmoothingEnabled=false;g.drawImage(src,0,0,o.width,o.height);return o.toDataURL()}

// ----- level up -----
function eligible(){
  return FORM.filter(f=>{if(P.weps[f.id])return false;const a=P.weps[f.a];if(!a||a.lv<MAXW)return false;
    if(f.k==='evo')return (P.pas[f.b]||0)>=1;const b=P.weps[f.b];return b&&b.lv>=MAXW});
}
let lvOpts=[];
function options(){
  const pool=[];
  for(const id in WEP){if(WEP[id].evo||P.used.has(id))continue;const w=P.weps[id];if(w){if(w.lv<MAXW)pool.push({t:'w',id,lv:w.lv+1,wt:id===curClass.w?4:3})}else pool.push({t:'w',id,lv:1,nw:1,wt:1.2})}
  for(const id in PAS){const l=P.pas[id]||0;if(l<5)pool.push({t:'p',id,lv:l+1,wt:l?1.5:1})}
  const out=[],el=eligible();
  // one card is always an upgrade to a spell you already own; the class's main spell is favoured
  const own=pool.filter(o=>o.t==='w'&&!o.nw);
  if(own.length){const main=own.find(o=>o.id===curClass.w),pick=main&&R()<.6?main:own[R()*own.length|0];out.push(pick);pool.splice(pool.indexOf(pick),1)}
  while(out.length<(el.length?2:3)&&pool.length){let s=0;for(const o of pool)s+=o.wt;let r=R()*s,j=0;for(;j<pool.length;j++){r-=pool[j].wt;if(r<=0)break}out.push(pool.splice(Math.min(j,pool.length-1),1)[0])}
  for(let i=out.length-1;i>0;i--){const j=R()*(i+1)|0;[out[i],out[j]]=[out[j],out[i]]}
  if(el.length)out.unshift({t:'f',f:el[R()*el.length|0]});
  if(!out.length)out.push({t:'h'});
  return out;
}
const formText=f=>`${glyph(f.a)}${WEP[f.a].name} Lv${MAXW} ＋ ${glyph(f.b)}${f.k==='evo'?PAS[f.b].name:WEP[f.b].name+' Lv'+MAXW}`;

    if(o.t==='f'){const W=WEP[o.f.id];return `<button class="card evo" type="button" data-i="${i}" style="--c:${W.c}"><span class="pic">${W.g}</span><span class="nm">${W.name}<span class="tag" style="--c:var(--gold)">${o.f.k==='evo'?'進化':'合成'}</span></span><span class="meta">${formText(o.f)}　·　按 ${i+1}</span><span class="ds">${W.d[0]}${o.f.k==='fuse'?'（會取代兩個原本的法術）':''}</span></button>`}

  }
  return `<div class="fcard ${cls}" style="--c:${f.k==='evo'?'var(--gold)':'#d68aff'}"><span class="kind">${f.k==='evo'?'進化':'合成'}</span>
    <div class="frow">${glyph(f.a)}${WEP[f.a].name}<span class="op">Lv${MAXW} ＋</span>${glyph(f.b)}${f.k==='evo'?PAS[f.b].name:WEP[f.b].name+'<span class="op"> Lv'+MAXW+'</span>'}<span class="op">→</span><span class="res">${glyph(f.id)}${W.name}</span></div>
    <p>${W.d[0]}</p>${st?`<p class="st ${cls==='ok'?'ok':''}">${st}</p>`:''}</div>`;
}
let tileURLs=null,foeURLs=null;
function renderCodex(){
  document.querySelectorAll('#tabs .tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===codexTab));
  const B=$('codexBody');let h='';
  if(codexTab==='form'){
    h=`<p class="hint">進化：法術練到 Lv${MAXW}（滿級），再擁有指定的被動（任何等級）。合成：兩個法術都練到 Lv${MAXW}，合成後兩個原法術會消失。條件達成後，下次升級時會出現金色選項。同一個法術只能用在一個公式裡，要自己取捨。</p>
      <h2>進化</h2><div class="cgrid">${FORM.filter(f=>f.k==='evo').map(formCard).join('')}</div>
      <h2>合成</h2><div class="cgrid">${FORM.filter(f=>f.k==='fuse').map(formCard).join('')}</div>`;
  }else if(codexTab==='spell'){
    h=`<p class="hint">點開法術可以看到每一級的效果。</p><div class="cgrid">`+Object.keys(WEP).filter(id=>!WEP[id].evo).map(id=>{const W=WEP[id];
      return `<details class="fcard"><summary>${glyph(id)}${W.name}</summary><ol>${W.d.map(x=>`<li>${x}</li>`).join('')}</ol><p class="st">可用於：${FORM.filter(f=>f.a===id||f.b===id).map(f=>WEP[f.id].name).join('、')}</p></details>`}).join('')+`</div>
      <h2>被動</h2><div class="cgrid">`+Object.keys(PAS).map(id=>{const S=PAS[id],fs=FORM.filter(f=>f.b===id);
      return `<details class="fcard"><summary>${glyph(id)}${S.name}</summary><p>每級 ${S.d}，最高 Lv5。</p><p class="st">${fs.length?'進化素材：'+fs.map(f=>WEP[f.a].name+' → '+WEP[f.id].name).join('、'):'不參與進化'}</p></details>`}).join('')+`</div>`;
  }else if(codexTab==='react'){
    const keys=Object.keys(REACT),n=keys.filter(k=>everDisc.has(k)).length;
    h=`<p class="hint">已發現 ${n} / ${RTOTAL}。在戰場上第一次觸發某種轉化就會記錄下來，紀錄會保留到下次遊玩。${state==='pause'?'黃點是這一局觸發過的。':''}</p>
      <ul class="codex">${keys.map(k=>everDisc.has(k)?`<li class="${discovered.has(k)&&state!=='title'?'run':''}">${REACT[k]}</li>`:`<li class="no">？？？</li>`).join('')}</ul>`;
  }else if(codexTab==='tile'){
    if(!tileURLs)tileURLs=TP.map((_,t)=>{const c=document.createElement('canvas');c.width=c.height=8;c.getContext('2d').drawImage(atlas,0,t*8,8,8,0,0,8,8);return scaleURL(c,4)});
    h=`<div class="cgrid">${TP.map((tp,t)=>`<div class="fcard tile"><img alt="" src="${tileURLs[t]}"><div><h3>${tp.n}</h3><p>${tp.d}</p></div></div>`).join('')}</div>`;
  }else{
    if(!foeURLs)foeURLs={};for(const k in ED)if(!foeURLs[k])foeURLs[k]=scaleURL(ED[k].spr[0].n,k==='boss'||k==='golem'?3:4);
    h=`<h2>關卡</h2><div class="cgrid">${STAGES.map((s,i)=>`<div class="fcard"><h3>第 ${i+1} 關　${s.name}　<span class="op" style="color:var(--dust)">${fmt(s.len)}</span></h3><p>${s.d}</p><p class="st">${s.foes}</p></div>`).join('')}</div>
      <h2>敵人</h2><div class="cgrid">${Object.keys(ED).map(k=>`<div class="fcard tile"><img class="en" alt="" src="${foeURLs[k]}"><div><h3>${ED[k].name}</h3><p>${ED[k].d}</p></div></div>`).join('')}</div>`;
  }
  B.innerHTML=h;
}
document.querySelectorAll('#tabs .tab').forEach(b=>b.onclick=()=>{codexTab=b.dataset.tab;renderCodex()});
$('codexBack').onclick=()=>show(codexFrom);
// ----- flow -----
function resetWorld(){
  SEED=(R()*1e9)|0;chunks.clear();lastK=-1;lastC=null;
  enemies=[];projs=[];fx=[];parts=[];gems=[];pickups=[];booms=[];meteors=[];
  time=0;stageKills=0;spawnAcc=0;bossI=0;nextSwarm=100;autoT=0;shakeT=0;
}
function enterStage(){
  BIOME=ST().biome;resetWorld();
  P.x=4;P.y=4;P.inv=1;
  for(const id in P.weps){P.weps[id].t=.5;delete P.weps[id].orbs}
  state='play';show(null);$('hud').hidden=false;$('toasts').innerHTML='';
  $('stage').textContent=`第 ${SI+1} 關　${ST().name}`;
  renderWeps();hud();
  toast(`第 ${SI+1} 關：${ST().name}`,'gold');AU.play(ST().biome);
}
function startGame(cls){
  curClass=cls;SI=0;kills=0;total=0;pendingLv=0;discovered=new Set();
  P=newPlayer(cls);
  PSPR=sset([playerRows(cls.helm,0),playerRows(cls.helm,1)],playerPal(cls));
  enterStage();
}
function stageClear(){
  if(SI>=STAGES.length-1){endGame(true);return}
  state='clear';joyEnd();AU.stop();AU.fx('clear');
  const S=ST(),N=STAGES[SI+1];
  $('clrEyebrow').textContent=`第 ${SI+1} 關通關　·　${DF().name}`;
  $('clrTitle').textContent='撐過了'+S.name;
  $('clrStats').innerHTML=[['等級',P.lvl],['本關擊殺',stageKills],['總擊殺',kills],['本局反應',discovered.size+'/'+RTOTAL]].map(s=>`<div class="stat"><span>${s[0]}</span><b>${s[1]}</b></div>`).join('');
  $('clrNext').innerHTML=`<h2 style="margin:0">下一關：${N.name}　<span style="color:var(--dust);font-size:13px">${fmt(N.len)}</span></h2><p>${N.d}</p><p style="color:var(--dust)">${N.foes}</p><p style="color:var(--moss)">等級、法術全部保留，進入下一關時回復一半生命。</p>`;
  $('nextBtn').textContent='前往'+N.name;
  show('scrClear');
  setTimeout(()=>$('nextBtn').focus({preventScroll:true}),30);
}
function nextStage(){if(state!=='clear')return;SI++;heal(P.maxhp*.5);enterStage()}
function toTitle(){
  BIOME='plains';SI=0;state='title';resetWorld();P=null;tcam.x=0;tcam.y=0;
  $('hud').hidden=true;$('toasts').innerHTML='';joyEnd();buildTitle();show('scrTitle');AU.play('title');
}
function endGame(win){
  if(state==='end')return;state='end';joyEnd();hud();AU.stop();AU.fx(win?'win':'lose');
  const all=store.get('ew-best',{}),prev=all[DF().id],stage=SI+1;
  const better=!prev||(win&&!prev.win)||(!prev.win&&stage>prev.stage)||(stage===prev.stage&&!!win===!!prev.win&&total>prev.time);
  if(better){all[DF().id]={stage,time:total,win:!!win};store.set('ew-best',all)}
  $('endEyebrow').textContent=`${curClass.name}　·　${DF().name}　·　${win?'全部通關':'倒在第 '+stage+' 關 '+ST().name}`;
  $('endTitle').textContent=win?'你征服了元素荒原':'你倒下了';
  $('endTitle').style.color=win?'var(--gold)':'';
  const st=[['總時間',fmt(total)],['到達關卡',stage+' / '+STAGES.length],['等級',P.lvl],['擊殺',kills],['本局反應',discovered.size+'/'+RTOTAL],['紀錄',better?'新紀錄':'—']];
  $('endStats').innerHTML=st.map(s=>`<div class="stat"><span>${s[0]}</span><b>${s[1]}</b></div>`).join('');
  setTimeout(()=>show('scrEnd'),win?200:700);
}
$('pauseBtn').onclick=pause;
$('codexBtn').onclick=()=>{pause();if(state==='pause')openCodex('scrPause')};
$('resumeBtn').onclick=resume;$('restartBtn').onclick=()=>startGame(curClass);$('menuBtn').onclick=toTitle;
$('pauseCodex').onclick=()=>openCodex('scrPause');$('titleCodex').onclick=()=>openCodex('scrTitle');$('clrCodex').onclick=()=>openCodex('scrClear');
$('nextBtn').onclick=nextStage;
function syncSnd(){
  document.querySelectorAll('.musT').forEach(b=>{b.setAttribute('aria-pressed',AU.music);b.textContent='音樂：'+(AU.music?'開':'關')});
  document.querySelectorAll('.sfxT').forEach(b=>{b.setAttribute('aria-pressed',AU.sfx);b.textContent='音效：'+(AU.sfx?'開':'關')});
  $('musBtn').textContent=AU.music?'音樂':'靜音';$('musBtn').setAttribute('aria-pressed',AU.music);
}
document.querySelectorAll('.musT').forEach(b=>b.onclick=()=>{AU.setMusic(!AU.music);syncSnd()});
document.querySelectorAll('.sfxT').forEach(b=>b.onclick=()=>{AU.setSfx(!AU.sfx);syncSnd()});
$('musBtn').onclick=()=>{AU.setMusic(!AU.music);syncSnd()};
syncSnd();
$('againBtn').onclick=()=>startGame(curClass);$('endMenuBtn').onclick=toTitle;

// ---------- input ----------
addEventListener('keydown',e=>{
  keys[e.code]=1;
  if(e.code==='Escape'||e.code==='KeyP'||e.code==='Space'){
    if(!$('scrCodex').hidden){show(codexFrom);e.preventDefault()}
    else if(state==='play'){pause();e.preventDefault()}
    else if(state==='pause'){resume();e.preventDefault()}
  }
  if(state==='level'&&/^Digit[1-3]$/.test(e.code))choose(+e.code.slice(5)-1);
  if(e.code.startsWith('Arrow'))e.preventDefault();
});
addEventListener('keyup',e=>{keys[e.code]=0});
addEventListener('blur',()=>{for(const k in keys)keys[k]=0;if(state==='play')pause()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(state==='play')pause();AU.suspend()}else AU.resume()});
const joyEl=$('joy'),knob=$('knob');
function joyEnd(){joy=null;joyEl.hidden=true}
cv.addEventListener('pointerdown',e=>{
  if(state!=='play')return;
  joy={id:e.pointerId,ox:e.clientX,oy:e.clientY,dx:0,dy:0};
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
  joyEl.style.left=e.clientX+'px';joyEl.style.top=e.clientY+'px';knob.style.transform='';joyEl.hidden=false;
});
cv.addEventListener('pointermove',e=>{
  if(!joy||e.pointerId!==joy.id)return;
  let dx=e.clientX-joy.ox,dy=e.clientY-joy.oy;const d=Math.hypot(dx,dy),m=44;
  if(d>m){dx*=m/d;dy*=m/d}
  joy.dx=dx/m;joy.dy=dy/m;knob.style.transform=`translate(${dx}px,${dy}px)`;
});
for(const ev of ['pointerup','pointercancel','lostpointercapture'])cv.addEventListener(ev,e=>{if(joy&&e.pointerId===joy.id)joyEnd()});

// ---------- loop ----------
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(state==='play'){animT+=dt;update(dt)}
  else if(state==='title'){animT+=dt;updateTitle(dt)}
  render();
  requestAnimationFrame(frame);
}
toTitle();
requestAnimationFrame(frame);
})();
</script>
